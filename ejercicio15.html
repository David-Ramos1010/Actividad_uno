<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 15 - Estudiantes</title>
  <link rel="stylesheet" href="css/ejercicio15.css">
  <script src="js/ejercicio15.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="contenedor-formulario">
    <h1>Promedio, mayor y menor calificación</h1>
    <p class="subtitulo">Ingresa nombre y calificación. Presiona "Agregar estudiante" y luego "Calcular".</p>

    <form class="formulario" onsubmit="return false;">
      <div class="grupo-formulario">
        <label for="nombre">Nombre del estudiante:</label>
        <input type="text" id="nombre" placeholder="Ej: Juan">
      </div>

      <div class="grupo-formulario">
        <label for="calificacion">Calificación:</label>
        <input type="number" id="calificacion" placeholder="Ej: 85" min="0" max="100" step="0.01">
      </div>

      <button type="button" class="boton-enviar" onclick="agregarEstudiante()">Agregar estudiante</button>
      <button type="button" class="boton-enviar" onclick="calcularResultados()">Calcular</button>
    </form>

    <div class="grupo-formulario">
      <label>Estudiantes registrados:</label>
      <ul id="listaEstudiantes"></ul>
    </div>

    <div class="grupo-triple">
      <div class="grupo-formulario">
        <label for="promedio">Calificación promedio:</label>
        <input type="text" id="promedio" readonly>
      </div>

      <div class="grupo-formulario">
        <label for="mayor">Estudiante con calificación más alta:</label>
        <input type="text" id="mayor" readonly>
      </div>

      <div class="grupo-formulario">
        <label for="menor">Estudiante con calificación más baja:</label>
        <input type="text" id="menor" readonly>
      </div>
    </div>
  </div>

  <footer>
    <p style="text-align: center; margin-top: 19px;"><em>© - David Efraín José Ramos</em></p>
  </footer>
</body>
</html>
