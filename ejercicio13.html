<!DOCTYPE html>
<html lang = "es">
	<head>
		<meta charset = "UTF-8">
		<meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
		<title>
			Ejercicio trece - Verificador de edad
		</title>
		<link rel = "stylesheet" href = "css/ejercicio13.css">
		<script src = "js/ejercicio13.js"></script>
		<link href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel = "stylesheet"> <!--Tengo la duda de que hace esta api-->
	</head>
	<body>
		<div class = "contenedor-formulario">
			<h1>Verificador de edad para votar</h1>
			<p class = "subtitulo">Asegurate que el campo de texto no este vacio y que el valor ingresado sea mayor a cero.</p>
			<form class = "formulario">

				<div class = "grupo-doble">
					<div class = "grupo-formulario">
						<label for = "num1">Introduce tu edad</label>
						<input type = "number" id = "num1" placeholder = "Ej: 20">
					</div>

					<div class = "grupo-formulario">
						<label for = "num2">Verificador de edad <span>(No editable)</span></label>
						<input type = "text" id = "num2" readonly>				
					</div>
				</div>

				<button type = "button" class = "boton-enviar" onclick = "Verificar()"> 
					Verificar <span>⇒</span>
				</button>
			</form>
		</div>
		
		<footer>
			<p style = "text-align: center; margin-top: 19px;"><em>© - David Efraín José Ramos</em></p>
		</footer>
	</body>
</html>
