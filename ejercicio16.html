<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 16 - Calculadora con funciones flecha</title>
  <link rel="stylesheet" href="css/ejercicio16.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/ejercicio16.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="contenedor-formulario">
    <h1>Calculadora de operaciones básicas</h1>
    <p class="subtitulo">Ingresa dos números y presiona el botón de la operación que deseas realizar.</p>

    <form class="formulario" onsubmit="return false;">
      <div class="grupo-formulario">
        <label for="numero1">Número 1:</label>
        <input type="text" id="numero1" placeholder="Ej: 10">
      </div>

      <div class="grupo-formulario">
        <label for="numero2">Número 2:</label>
        <input type="text" id="numero2" placeholder="Ej: 5">
      </div>

      <div class="grupo-cuadruple">
        <button type="button" class="boton-operacion" onclick="calcularOperacion('suma')">Sumar</button>
        <button type="button" class="boton-operacion" onclick="calcularOperacion('resta')">Restar</button>
        <button type="button" class="boton-operacion" onclick="calcularOperacion('multiplicacion')">Multiplicar</button>
        <button type="button" class="boton-operacion" onclick="calcularOperacion('division')">Dividir</button>
      </div>

      <div class="grupo-formulario">
        <label for="resultado">Resultado:</label>
        <input type="text" id="resultado" readonly>
      </div>
    </form>
  </div>

  <footer>
    <p style="text-align: center; margin-top: 19px;"><em>© - David Efraín José Ramos</em></p>
  </footer>
</body>
</html>
